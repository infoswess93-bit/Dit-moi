<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2457f5">
<title>Dis-moi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">
  <div class="game" id="game" aria-label="Ваш прогрес">
    <div class="ghead"><h1>Dis-moi</h1><span class="gpts"><b id="gxp">0</b> балів</span></div>
    <div class="grow"><span id="glvl"></span><span id="gstreak"></span></div>
    <div class="gbar" aria-hidden="true"><i id="gbarfill"></i></div>
  </div>

  <div class="tabs" id="maintabs" role="tablist" aria-label="Розділ">
    <button type="button" class="tab" role="tab" data-g="tenses" aria-selected="true">Часи</button>
    <button type="button" class="tab" role="tab" data-g="topics" aria-selected="false">Практика</button>
    <button type="button" class="tab" role="tab" data-g="err" aria-selected="false">Помилки<span class="badge" id="errcount" hidden>0</span></button>
    <button type="button" class="tab" role="tab" data-g="vocab" aria-selected="false">Словник<span class="badge acc" id="vocabcount" hidden>0</span></button>
    <button type="button" class="tab" role="tab" data-g="gram" aria-selected="false">Граматика</button>
  </div>
  <button type="button" class="navbar" id="navbar" aria-expanded="false" aria-controls="navpanel" hidden>
    <span id="navlabel"></span><span class="navchev" aria-hidden="true">▾</span>
  </button>
  <div class="navpanel" id="navpanel" hidden>
    <div class="subtabs" id="subtabs" role="tablist" aria-label="Тема"></div>
    <div class="lessons" id="lessons" role="tablist" aria-label="Урок"></div>
    <details class="recap" id="recapbox">
      <summary>Коротке нагадування</summary>
      <div class="recap-body" id="recap"></div>
    </details>
  </div>
  <p class="note" id="errnote" hidden></p>

  <div class="progress" id="progress" aria-live="polite">
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0" id="bar"><i id="barfill"></i></div>
    <span class="count" id="count">1 / 20</span>
  </div>

  <main id="stage"></main>
</div>
<div class="toast" id="toast" hidden><span id="toasttext"></span></div>

<script src="data/tenses.js"></script>
<script src="data/topics.js"></script>
<script src="data/tenses2.js"></script>
<script src="data/sets.js"></script>
<script src="data/gloss.js"></script>
<script src="data/vocab-presets.js"></script>
<script src="data/grammar.js"></script>
<script src="js/app.js"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
