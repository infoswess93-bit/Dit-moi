<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2457f5">
<title>Dis-moi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">
  <header class="top" id="game" aria-label="Ваш прогрес">
    <h1>Dis-moi</h1>
    <div class="tstat"><span id="glvl"></span><span id="gstreak"></span><span class="gpts"><b id="gxp">0</b> балів</span></div>
    <button type="button" class="gear" id="setbtn" aria-label="Налаштування" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <div class="gbar" aria-hidden="true"><i id="gbarfill"></i></div>
  </header>

  <button type="button" class="navbar" id="navbar" aria-expanded="false" aria-controls="navpanel" hidden>
    <span id="navlabel"></span><span class="navchev" aria-hidden="true">▾</span>
  </button>
  <div class="navpanel" id="navpanel" hidden>
    <div class="seg" id="groupseg" role="group" aria-label="Тип уроків">
      <button type="button" class="segbtn" data-grp="tenses" aria-pressed="true">Часи</button>
      <button type="button" class="segbtn" data-grp="topics" aria-pressed="false">Практика</button>
    </div>
    <div class="subtabs" id="subtabs" role="tablist" aria-label="Тема"></div>
    <div class="lessons" id="lessons" role="tablist" aria-label="Урок"></div>
    <details class="recap" id="recapbox">
      <summary>Коротке нагадування</summary>
      <div class="recap-body" id="recap"></div>
    </details>
  </div>
  <p class="note" id="errnote" hidden></p>

  <div class="progress" id="progress" aria-live="polite">
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0" id="bar"><i id="barfill"></i></div>
    <span class="count" id="count">1 / 20</span>
  </div>

  <main id="stage"></main>
</div>
<nav class="bnav" id="maintabs" aria-label="Розділи">
  <div class="bnav-in">
    <button type="button" class="tab" data-g="home" aria-current="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7V20h-5.5v-6h-6v6H3.5z"/></svg><span>Сьогодні</span></button>
    <button type="button" class="tab" data-g="lessons" aria-current="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v15H7.5A2.5 2.5 0 0 0 5 20.5zM5 20.5A2.5 2.5 0 0 0 7.5 23"/><path d="M5 20.5V5.5"/></svg><span>Уроки</span></button>
    <button type="button" class="tab" data-g="err" aria-current="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg><span>Помилки</span><b class="badge" id="errcount" hidden>0</b></button>
    <button type="button" class="tab" data-g="vocab" aria-current="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="13" height="14" rx="2"/><path d="M8 4h11a2 2 0 0 1 2 2v11"/></svg><span>Словник</span><b class="badge acc" id="vocabcount" hidden>0</b></button>
    <button type="button" class="tab" data-g="gram" aria-current="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg><span>Граматика</span></button>
  </div>
</nav>
<div class="toast" id="toast" hidden><span id="toasttext"></span></div>

<script src="data/tenses.js"></script>
<script src="data/topics.js"></script>
<script src="data/tenses2.js"></script>
<script src="data/sets.js"></script>
<script src="data/gloss.js"></script>
<script src="data/vocab-presets.js"></script>
<script src="data/grammar.js"></script>
<script src="js/app.js"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});</script>
</body>
</html>
